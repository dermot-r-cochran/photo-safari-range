name: Pages

# Serves index.html (and images/, once there are any) from GitHub Pages on
# every push to main. Nothing is installed and nothing is built.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: The check still passes on what is about to be served
        run: node tools/check.js

      - name: Stage the game
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          if [ -d images ]; then cp -r images _site/images; fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
